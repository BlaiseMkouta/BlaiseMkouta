
<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="30%" style="stop-color:#36BCF7"/>
      <stop offset="70%" style="stop-color:#36BCF7"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="120" fill="url(#bg)" rx="8"/>

  <!-- Decorative dots -->
  <circle cx="40" cy="30" r="2" fill="#36BCF7" opacity="0.4"/>
  <circle cx="60" cy="50" r="1.5" fill="#36BCF7" opacity="0.3"/>
  <circle cx="860" cy="30" r="2" fill="#36BCF7" opacity="0.4"/>
  <circle cx="840" cy="55" r="1.5" fill="#36BCF7" opacity="0.3"/>
  <circle cx="80" cy="80" r="1" fill="#36BCF7" opacity="0.2"/>
  <circle cx="820" cy="80" r="1" fill="#36BCF7" opacity="0.2"/>

  <!-- Main name -->
  <text x="450" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="2">
    Blaise Mkouta Lele
  </text>

  <!-- Subtitle -->
  <text x="450" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="14"
        fill="#36BCF7" text-anchor="middle" letter-spacing="1">
    Fullstack Web &amp; Mobile Developer  •  UI/UX Designer
  </text>

  <!-- Bottom line -->
  <rect x="0" y="110" width="900" height="2" fill="url(#line)" rx="1"/>
</svg>
